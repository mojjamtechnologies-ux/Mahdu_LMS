<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19235c" />
    <script>
      /* Applies the saved theme and language before the first paint, so the page never flashes the wrong theme or direction. */
      (function () {
        try {
          var t = localStorage.getItem("mr_theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) {
            r.classList.add("dark");
            r.style.colorScheme = "dark";
          }
          var l = localStorage.getItem("mr_lang");
          if (l === "ar") {
            r.lang = "ar";
            r.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
    <title>معهد الرحمة الإسلامي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/mahdu.png" />
    <link rel="apple-touch-icon" href="/mahdu.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Public+Sans:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
